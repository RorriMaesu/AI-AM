name: AI-AM verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ai-am-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test persistence, contracts, scheduler, and API
        run: python -B tests/run_tests.py --temp-dir "${{ runner.temp }}/ai-am-tests" --verbose

  dashboard-tests:
    name: Offline dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check ui/app.js
      - name: Test dashboard helpers and rendering boundaries
        run: node --test tests/ui.test.cjs
